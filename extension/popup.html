<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moho Browser Workspace</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 350px;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .title { font-size: 15px; font-weight: 700; color: #38bdf8; }
    .version { font-size: 11px; background: #1e293b; color: #94a3b8; padding: 2px 8px; border-radius: 999px; }
    .card {
      background: #1e293b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #334155;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .row:last-child { margin-bottom: 0; }
    .label { color: #94a3b8; }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .badge-ok { background: #064e3b; color: #34d399; }
    .badge-warn { background: #78350f; color: #fbbf24; }
    .badge-off { background: #334155; color: #cbd5e1; }
    .detail { font-size: 12px; color: #cbd5e1; margin-top: 6px; word-break: break-word; }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    button {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: #0284c7; color: #fff; }
    .btn-danger { background: #dc2626; color: #fff; }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">✦ Moho Browser Workspace</span>
    <span class="version">v4.0.0</span>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">حالة الجسر (Bridge)</span>
      <span id="bridge-status" class="badge badge-off">جاري الفحص...</span>
    </div>
    <div class="row">
      <span class="label">مساحة العمل</span>
      <span id="workspace-status" class="badge badge-off">غير متصلة</span>
    </div>
    <div id="workspace-detail" class="detail">افتح تطبيقًا متصلًا لبدء مساحة عمل معزولة.</div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">تحكم وكلاء الذكاء الاصطناعي</span>
      <span id="agent-status" class="badge badge-off">غير معروف</span>
    </div>
    <div class="detail">يدعم: Gemini Computer Use و Claude و OpenAI CUA</div>
    <div class="actions">
      <button id="toggle-agent" class="btn-primary" disabled>تبديل تحكم الوكيل</button>
      <button id="close-workspace" class="btn-danger" disabled>إغلاق المساحة</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
